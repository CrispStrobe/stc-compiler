name: ci

# The AVR bundle is Linux x86_64. It is built on whatever machine a developer
# happens to use -- often macOS, where the binaries cannot be executed at all --
# so "the script ran and produced 45 MB" is not evidence that any of it works.
# This is where that gets checked, on a runner that can actually run them.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # No toolchain needed: the emitter and the front end are pure Python.
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Golden files (what the emitter emits, byte for byte)
        run: python3 ./scripts/test-golden.py
      - name: Round-trip transparency
        run: python3 ./scripts/test-roundtrip.py
      - name: Debug symbol table
        run: python3 ./scripts/test-symtab.py
      # The micro:bit target has no compiler to hold it to account, so the
      # generated MicroPython is EXECUTED against a stub instead: that the
      # cooperative generators interleave, that a wait lasts about as long as
      # it says, and that ACTIVE LOW reaches the pin inverted.
      - name: micro:bit — run the generated MicroPython
        run: python3 ./scripts/test-microbit.py
      - name: Parity — every target, every feature, exercised
        run: python3 ./scripts/test-parity.py
      - name: Peripherals (PWM, tone, print)
        run: python3 ./scripts/test-peripherals.py
      - name: Tables and whole-port I/O
        run: python3 ./scripts/test-tables-ports.py
      # A pin number inside the board's range is still not always a pin that
      # can do what was asked -- the Nano's A6/A7 reach the pad with no
      # digital buffer at all, so digitalWrite to one is accepted everywhere
      # and does nothing.
      - name: Pin maps — what each package actually brings out
        run: python3 ./scripts/test-pinmap.py
      - name: A wait too short for the target is refused
        run: python3 ./scripts/test-wait-floor.py
      # Last, because it checks the steps above exist: a test that is written
      # and never run reads as coverage and is not.
      - name: Every test is wired into CI, or says why not
        run: python3 ./scripts/test-wiring.py

  # The real verification: build the vendored AVR toolchain from Debian and
  # prove it compiles, links and emits an image using ONLY those binaries.
  avr-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the vendored bundle
        run: ./scripts/fetch-avr-gcc.sh

      # Where the toolchain ACTUALLY looks, printed before anything asserts.
      # Debian bakes absolute paths into gcc and relocates them relative to
      # argv[0]; guessing which ones survive a move has cost two CI rounds
      # already, so it is recorded here rather than reasoned about.
      - name: Where the driver looks
        continue-on-error: true
        run: |
          AVR="$PWD/avr"
          echo "--- tree ---"
          find avr -maxdepth 3 -type d | sort | head -30
          echo "--- symlinks ---"
          find avr -maxdepth 2 -type l -exec ls -l {} \; || true
          echo "--- -print-search-dirs ---"
          "$AVR/bin/avr-gcc" -print-search-dirs || true
          echo "--- include search path ---"
          echo | "$AVR/bin/avr-gcc" -mmcu=atmega328p -E -v -x c - 2>&1 \
            | sed -n '/search starts here/,/End of search/p' || true

      # The check CI cannot make by running things: the runner HAS libmpc,
      # libmpfr, libgmp and libz installed, so a bundle that forgot to vendor
      # them compiles perfectly here and dies on Vercel with "error while
      # loading shared libraries". That happened. This is static, so it does
      # not care what the runner has installed.
      - name: Every non-glibc dependency travels with the bundle
        run: python3 ./scripts/elf-needed.py --check avr

      - name: Verify it runs, compiles and links
        run: ./scripts/verify-avr.sh

      - name: Generated code builds with the vendored toolchain, warning-free
        run: |
          set -euo pipefail
          AVR="$PWD/avr"
          fail=0
          # Every part in app.py's AVR_TARGETS, not just the one the goldens
          # declare: fetch-avr-gcc.sh drops 265 of avr-libc's 267 device
          # headers, and a part whose header was trimmed away fails HERE
          # rather than in production.
          for mcu in atmega328p atmega168p; do
            for f in scripts/golden/avr.c scripts/golden/avr-scripts.c \
                     scripts/golden/avr-parity.c \
                     scripts/golden/avr-port.c \
                     scripts/golden/avr-part.c; do
              echo "== $mcu  $f"
              # -Werror is the point: generated code that needs a warning
              # suppressed at the call site is generated code with a defect.
              if "$AVR/bin/avr-gcc" -mmcu=$mcu -Os -std=c99 \
                   -Wall -Wextra -Werror -Wno-implicit-fallthrough \
                   -Wno-sign-compare \
                   -o /tmp/g.elf "$f"; then
                "$AVR/bin/avr-size" --mcu=$mcu --format=avr /tmp/g.elf \
                  | grep -E "Program:" | sed 's/^/    /'
              else
                echo "    FAILED"; fail=1
              fi
            done
          done
          exit $fail

      - name: Bundle size and GLIBC floor
        run: |
          du -sh avr
          # Vercel runs Amazon Linux 2023 (glibc 2.34). Anything above that
          # will not start there, and this is the only place it gets caught.
          # All three compilers proper: cc1 (C), cc1plus (the Arduino route's
          # C++) and lto1 (its -flto link) are separate programs, and a C
          # compile that works proves nothing about the other two.
          for prog in cc1 cc1plus lto1; do
            f="avr/lib/gcc/avr/$(cat avr/GCC_VERSION)/$prog"
            test -x "$f" || { echo "::error::$prog missing from the bundle"; exit 1; }
            need="$(strings "$f" | grep -oE 'GLIBC_2\.[0-9]+' | sort -V | tail -1 | cut -d_ -f2)"
            echo "$prog needs at most GLIBC $need"
            if [ "$(printf '%s\n2.34\n' "$need" | sort -V | tail -1)" != "2.34" ]; then
              echo "::error::$prog needs GLIBC $need, above Vercel's 2.34"
              exit 1
            fi
          done

      # The rebuilt bundle (not the committed one) compiles real Arduino C++:
      # app.py stages whatever is in avr/, which this job just regenerated.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The rebuilt bundle compiles Arduino C++ for every board
        run: |
          pip install --quiet pytest fastapi pydantic
          python3 -m pytest -q test_arduino_cpp.py

      # avr/ is gitignored, so this is how a verified bundle gets off the
      # runner without 45 MB of binaries landing in git history.
      - uses: actions/upload-artifact@v4
        with:
          name: avr-toolchain
          path: avr/
          retention-days: 14

  # The full-C RISC-V bundle (riscv-gcc/): native gcc + picolibc for the
  # riscv32-gcc target. Unlike avr-bundle this VERIFIES THE COMMITTED bundle
  # rather than rebuilding it (~250 MB of Debian debs per run) — the bundle
  # ships in git and Vercel deploys it as-is, so the checks that matter are:
  # every non-glibc dep travels with it, nothing needs GLIBC > 2.34, it
  # compiles real C, and it stays within the deploy budget.
  # scripts/fetch-riscv-gcc.sh reproduces it from source out of band.
  riscv-gcc-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The check CI cannot make by running things: the runner HAS libstdc++,
      # libisl, etc., so a bundle that forgot to vendor one compiles here and
      # dies on Vercel with "error while loading shared libraries". Static.
      - name: Every non-glibc dependency travels with the bundle
        run: python3 ./scripts/elf-needed.py --check riscv-gcc

      - name: Nothing needs GLIBC above Vercel's 2.34
        run: |
          set -euo pipefail
          worst=2.0
          for f in $(find riscv-gcc/bin riscv-gcc/lib/gcc riscv-gcc/lib/riscv64-unknown-elf/bin riscv-gcc/lib-deps -type f); do
            need="$(objdump -T "$f" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' | sort -V | tail -1 | cut -d_ -f2 || true)"
            [ -n "$need" ] && [ "$(printf '%s\n%s\n' "$worst" "$need" | sort -V | tail -1)" = "$need" ] && worst="$need"
          done
          echo "highest GLIBC required across the bundle: $worst"
          if [ "$(printf '%s\n2.34\n' "$worst" | sort -V | tail -1)" != "2.34" ]; then
            echo "::error::the bundle needs GLIBC $worst, above Vercel's 2.34"; exit 1
          fi

      - name: It compiles real C (floats, malloc, qsort) to an rv32 ELF
        run: |
          set -euo pipefail
          B="$PWD/riscv-gcc"
          cat > /tmp/full.c <<'C'
          #include <stdio.h>
          #include <stdlib.h>
          #include <math.h>
          static int cmp(const void*a,const void*b){return *(const int*)a-*(const int*)b;}
          int main(void){int v[3]={3,1,2};qsort(v,3,sizeof(int),cmp);
            char*p=malloc(8);p[0]='x';printf("%d%d%d %.3f %c\n",v[0],v[1],v[2],sqrt(2.0),p[0]);free(p);return 0;}
          C
          LD_LIBRARY_PATH="$B/lib-deps" "$B/bin/riscv64-unknown-elf-gcc" \
            -march=rv32imac -mabi=ilp32 -Os -Wall -Werror -nostdlib \
            -isystem "$B/picolibc/include" -T "$B/runtime/riscv-cc.ld" \
            "$B/runtime/crt0.S" "$B/runtime/console.c" /tmp/full.c \
            -L"$B/picolibc/lib" -lc -lm -lgcc -o /tmp/full.elf
          test -s /tmp/full.elf
          # e_machine (offset 18, LE) must be 243 (RISC-V)
          python3 - <<'PY'
          b=open('/tmp/full.elf','rb').read()
          assert b[:4]==b'\x7fELF' and b[4]==1 and (b[18]|b[19]<<8)==243, "not an rv32 ELF32"
          print("rv32 ELF32 OK,", len(b), "bytes")
          PY

      - name: Bundle size stays within the deploy budget
        run: |
          set -euo pipefail
          kb=$(du -sk riscv-gcc arm avr cc65 | awk '{s+=$1} END{print s}')
          mb=$((kb/1024))
          echo "committed toolchain bundles total: ${mb} MB"
          # Vercel's function ceiling is 250 MB unzipped (bundles + python + app).
          # Keep the toolchains comfortably under it; the riscv-gcc bundle must
          # not have ballooned (a lost --strip-debug, an extra multilib).
          if [ "$mb" -gt 170 ]; then
            echo "::error::toolchain bundles are ${mb} MB (>170); trim riscv-gcc"; exit 1
          fi

  # The pytest suite at the repository root: the dialect, every PART, the
  # display verbs, the Arcade back end, the five assembler chains, UF2,
  # listings, ARM builds, and the device conformance matrix.
  #
  # It was written, committed, green and NEVER RUN here until 2026-09-02 --
  # seventeen files and 380 tests that read as coverage in the file listing
  # and were not. test-wiring.py exists to catch exactly that and did not,
  # because it only ever scanned scripts/. It scans both now.
  #
  # Needs the vendored toolchains, which are committed, so a plain checkout
  # is enough; app.py stages them into /tmp on demand as it does in
  # production.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # wasmtime runs the vendored shecc.wasm for the RISC-V target; installing
      # it here means test_riscv_build.py actually exercises that path rather
      # than skipping it (qemu-riscv32 is absent, so only its run subtest skips).
      - run: pip install --quiet pytest fastapi pydantic wasmtime
      - name: The root pytest suite
        run: python3 -m pytest -q test_*.py

  # Arduino C++ that RUNS. test_arduino_cpp.py proves sketches link; this
  # builds them through compile_source and executes them in avr8js, asserting
  # on what the simulated chip transmitted and how often its LED toggled --
  # at the board's own crystal, so an image built for the wrong F_CPU fails.
  arduino-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install --quiet fastapi pydantic
      - run: npm install --no-save avr8js@0.21.1
      - name: Sketches run in avr8js and print what they should
        run: python3 ./scripts/test-arduino-run.py

  # The static site. It claims to run the project's own transpiler in the
  # browser rather than a JavaScript copy of it, and the only way to know
  # that is to start a browser and watch it happen.
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: docs/ still mirrors the transpiler
        run: python3 ./scripts/test-pages.py
      # Flashing is the one step whose output cannot be checked by compiling
      # it, so the far end of the wire is simulated instead.
      # Includes the STC differential check: the packets this emits are
      # compared against a transcript real stcgal produced.
      - name: Flash into simulated bootloaders, and match stcgal byte for byte
        run: node scripts/test-flash.mjs
      - name: Install a browser
        run: |
          npm install --no-save playwright@1.60.0
          npx playwright install --with-deps chromium
      - name: Transpile every example in the browser
        run: |
          (cd docs && python3 -m http.server 8765 &) 
          for i in $(seq 1 20); do
            curl -sf http://localhost:8765/index.html >/dev/null && break
            sleep 0.5
          done
          node scripts/check-pages.js http://localhost:8765

  # The end-to-end path: pseudocode in, Intel HEX out, through the real
  # endpoint rather than through the emitter alone.
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet fastapi pydantic
      - name: Install a system avr-gcc for the fallback path
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-avr avr-libc
      - name: POST /compile for an ATmega part returns a real image
        run: |
          python - <<'PY'
          import asyncio, base64, sys
          import app

          def run(**kw):
              return asyncio.run(app.compile_source(app.CompileReq(**kw)))

          fails = []

          r = run(code=open("scripts/golden/avr.bw").read(), language="pseudocode")
          if not r.get("success"):
              fails.append(f"pseudocode->avr failed: {r.get('error')}")
          else:
              hexed = base64.b64decode(r["base64"]).decode()
              if not hexed.startswith(":"):
                  fails.append("output is not Intel HEX")
              print(f"  ok  pseudocode -> {r['filename']} {r['bytes']} B mcu={r.get('mcu')}")

          r = run(code="#include <avr/io.h>\nint main(void){DDRB|=_BV(PB5);for(;;);}\n",
                  language="c", target="atmega328p", fosc=16000000)
          if not r.get("success"):
              fails.append(f"C->avr failed: {r.get('error')}")
          else:
              print(f"  ok  C -> {r['bytes']} B")

          # Arduino core C++ builds (it was refused, naming arduino-cli, until
          # the bundle kept cc1plus and the core was vendored). This job has a
          # SYSTEM gcc-avr as well; the image must come from the core route.
          r = run(code=open("scripts/golden/arduino.bw").read(), language="pseudocode")
          if not r.get("success") or r.get("toolchain") != "avr-gcc+ArduinoCore-avr":
              fails.append(f"arduino core should build: {r.get('error')}")
          else:
              print(f"  ok  arduino core C++ -> {r['filename']} {r['bytes']} B")

          if fails:
              print("\n".join("  FAIL " + f for f in fails)); sys.exit(1)
          print("\nservice path ok")
          PY

      # The 8051 half of the same endpoint, and the only way a browser can ever
      # obtain a debug symbol table: it cannot run sdcc, and it cannot run
      # Python. Without this the debugger can halt a program but not say where.
      - name: POST /compile returns a debug symbol table
        run: |
          python - <<'PY'
          import asyncio, sys
          import app

          def run(**kw):
              return asyncio.run(app.compile_source(app.CompileReq(**kw)))

          TWO = """DEVICE STC12C5A60S2:
            CLOCK 11059200
            PIN led1 = P1.0 OUTPUT ACTIVE LOW
            PIN led2 = P1.1 OUTPUT ACTIVE LOW
            WHEN started:
              FOREVER:
                toggle led1
                wait 150 ms
            WHEN started:
              REPEAT 3:
                toggle led2
                wait 300 ms
          """
          ONE = """DEVICE STC12C5A60S2:
            CLOCK 11059200
            PIN led = P1.0 OUTPUT ACTIVE LOW
            WHEN started:
              FOREVER:
                toggle led
                wait 500 ms
          """

          fails = []

          r = run(code=TWO, language="pseudocode", symbols=True)
          if not r.get("success"):
              fails.append(f"two-task compile failed: {r.get('error')}")
          else:
              s = r.get("symbols")
              if not s:
                  fails.append(f"no symbol table: {r.get('symbols_error')}")
              else:
                  tasks = s["scheduler"]["tasks"]
                  ys = [y for t in tasks for y in t["yields"]]
                  if len(tasks) != 2:
                      fails.append(f"expected 2 tasks, got {len(tasks)}")
                  # An address is the whole point: without --debug reaching the
                  # LINK step the .cdb has symbols and no addresses at all.
                  if any("addr" not in y for y in ys):
                      fails.append("a yield has no code address")
                  if s["scheduler"]["bw_ms"]["space"] != "iram":
                      fails.append("bw_ms is not in iram")
                  print(f"  ok  {len(tasks)} tasks, {len(ys)} yields, "
                        f"bw_ms @ 0x{s['scheduler']['bw_ms']['addr']:02x}, {r['bytes']} B")

          # A single WHEN has no scheduler, so there is no Level 1 position to
          # describe. That must not fail the BUILD — the image is fine.
          r = run(code=ONE, language="pseudocode", symbols=True)
          if not r.get("success"):
              fails.append(f"single-task compile should still succeed: {r.get('error')}")
          elif r.get("symbols") is not None:
              fails.append("a single-WHEN program cannot have a symbol table")
          elif "single-WHEN" not in (r.get("symbols_error") or ""):
              fails.append(f"unhelpful reason: {r.get('symbols_error')}")
          else:
              print("  ok  single-WHEN builds, and says why it has no table")

          # Not asking for symbols must change nothing.
          r = run(code=TWO, language="pseudocode")
          if r.get("symbols") is not None or r.get("symbols_error") is not None:
              fails.append("symbols leaked into a request that did not ask")
          else:
              print("  ok  a plain compile is untouched")

          if fails:
              print("\n".join("  FAIL " + f for f in fails)); sys.exit(1)
          print("\nsymbol table ok")
          PY
